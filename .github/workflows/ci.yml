name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # 只对 PR 抢跑：连推 main 时把正要出结论的那次 ~7 分钟跑取消掉，等于那个 commit 永远没有结论，
  # 而后一次绿覆盖的是另一棵树。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: 质量门禁（格式 / Lint / 类型 / 测试 / 演练）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 钉住哈希种子：`test_knowledge_memory.py` 的 hypothesis 用例随 PYTHONHASHSEED 抖（本机口径一直是 0），
      # 而 mock 智能体的一处随机种子也取自 hash()。不钉就是"同一 commit 两次跑结论不同"，
      # 再叠上 --maxfail 就会变成随机截断整场。
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true

      - name: 依赖锁必须先自洽
        # 不这一步，CI 会对活 PyPI 重解，测出来的闭包可能不是镜像（deploy/Dockerfile 用 --frozen）装的闭包。
        run: uv lock --check

      - name: 安装依赖
        # 各可选子系统（持久层/分析/检索/边缘/图谱/MCP 工具面）的离线单测需要真驱动才能跑起来：
        # 只装 dev 会让这些用例静默跳过，绿色 CI 等于什么都没测。
        # `iot`（aiomqtt）与 `deploy/Dockerfile` 的那串 extras 对齐：少它时 MQTT 的装配面用例只能跳过，
        # 而 `test_mqtt_wiring.py` 里有一条按部署面判定的守卫用例专门钉这一点（2026-10-13 CI 就是红在这条上）。
        run: uv sync --frozen --extra dev --extra perf --extra postgres --extra iot --extra analytics --extra retrieval --extra edge --extra graph --extra seekdb --extra mcp

      - name: 装前端源码依赖（两条上游读取器漂移守卫要用）
        # `test_offline_tile_format.py` 里有两条守卫是读 `frontend/node_modules` 里的
        # Cesium/pmtiles 源码来判"上游解析顺序有没有漂移"的。gate job 此前不跑 npm，
        # 而 node_modules 又不在版本控制里 ⇒ 这两条在 CI 上永远 skip、永远不判。
        # 本机装了就会跑，但门禁的结论必须由 CI 给出，所以在这里真装一次。
        # 顺带把仓库根的 npm 编排依赖也装上（根 package-lock.json 此前没有任何 job 装过）。
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: npm ci（前端与仓库根）
        # 本 job 的 defaults 是 backend，所以一律用绝对路径，别写相对 `npm ci` 装到 backend 里去。
        run: |
          npm --prefix "$GITHUB_WORKSPACE" ci
          npm --prefix "$GITHUB_WORKSPACE/frontend" ci

      - name: 格式检查
        run: uv run ruff format --check src tests scripts

      - name: 静态检查
        run: uv run ruff check src tests scripts

      - name: 类型检查
        run: uv run mypy src

      - name: 单元 + 契约门禁 + 端到端
        # 去掉 --maxfail=1：它让一次跑只暴露第一条红，本批连续三次都是"修好一条才露出下一条"
        # （perf 断言 → MQTT 的 extras → 离线瓦的跨平台字节）。红要一次看全。
        # 计数进产物：`-q` 叠上 pyproject addopts 的 `-q` 是 `-qq`，汇总行会被吞掉，
        # 事后连"跑了几条、跳了几条"都无从复核。
        run: uv run pytest -q --junitxml=reports/junit-gate.xml

      - name: 指标实测冒烟（Mock 智能体）
        run: uv run python -m scripts.metrics_report --rounds 6 --agents --out reports/ci-metrics.json

      - name: 质量表回归门禁（§4.5 / D8：任一回退即不过）
        # 基线档由 `--write-baseline` 生成后入库；各列里只有 STU合法率能离线实算，
        # 首过率要有真调用台账（--usage，CI 无密钥），另三列需金标集与裁判模型——
        # 这些在 CI 档里是 null：不参与判定，既不会谎报达标也不会谎报退步。
        run: uv run python -m scripts.quality_gate --baseline baselines/quality_baseline.json --json reports/ci-quality.json

      - name: 上传指标报告与测试计数
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report
          path: |
            backend/reports/ci-metrics.json
            backend/reports/ci-quality.json
            backend/reports/junit-gate.xml
          # ignore 会让"报告没生成"这种半失败静默通过；这里 pytest 一定产出 junit，缺了就是出事。
          if-no-files-found: error

  frontend:
    name: 前端门禁（类型 / 单测 / 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 跟 .nvmrc 走：README 的实测口径是 node v24.11.1 / npm 11.6.2，
          # 而这里曾写死 '20'——门禁验的是没人用的那一版。
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  frontend-e2e:
    # Playwright 真浏览器档此前只在本地手工跑过（docs/REPORT.md 有"71 项通过"的记录），云端从不挡合并——
    # 地图与重叠类回归因此可以静默坏掉。第一阶段只纳 `map-visual.spec.ts`：
    # 它零后端依赖（webServer 自己 build + `vite preview`，且反向断言"请求源只剩本机 origin"），
    # 7 项 ~17.5s，加上装浏览器约 5–8 分钟。本机 2026-10-14 实测：`7 passed (1.5m)`，
    # 且 preview 的 /api 代理在没有后端时会往 127.0.0.1:8000 留下 ECONNREFUSED 日志——
    # 那是日志噪声不是失败原因，这 7 项断的是地图与资产面，没有一条依赖后端返回。
    # 不纳 `ui-overlap.spec.ts` 是**决策不是漏配**：它 beforeAll 直打真后端 `AEGIS_API_TARGET`、
    # 单线程 17–21 分钟、且已知有一项靠自适应重试（GPU 抢占时 leafCount 漂）。要进门禁得先起后端并拆组，
    # 那属于另一件事，见 docs/REPORT.md 与本文件末尾的说明。
    name: 前端真浏览器门禁（Playwright / 地图可视）
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # --with-deps 装的是 headless shell 需要的系统库；runner 上没有真 GPU，配置里刻意走 SwiftShader。
      - run: npx playwright install --with-deps chromium
      - name: 地图可视 e2e
        # 不给 retries：`playwright.config.ts` 里 retries=0 是有意的——一次重试会把"红得有道理"
        # 变成"绿得没道理"。这一档如果开始出现随机红，处置方式是查断言的时序假设，不是加重试。
        run: npx playwright test e2e/map-visual.spec.ts
      - name: 失败时留现场
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-map-visual
          path: frontend/test-results/
          if-no-files-found: warn

  deploy-artifacts:
    # 部署面的工件此前只有人手工跑过一次：compose 能不能解析、告警规则与分发配置过不过校验。
    # "文件存在"和"链路能起"是两件事——这条 job 把它们钉成构建失败，而不是交付后现场才发现。
    name: 部署面工件校验（compose 解析 / 镜像构建 / promtool / amtool）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose 三个 profile 必须能解析（凭据取自 .env.example）
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml \
            --profile observability --profile app --profile iot config --quiet
      - name: postgres 镜像必须真的构建得起来
        # `config --quiet` 只看语法，看不见 apt 源活不活。2026-10-12 本机实测的正是这种失败：
        # 基座 postgis/postgis:17-3.5 是 bullseye，而 PGDG 撤了 bullseye-pgdg 的 Release 文件
        # （apt 报 "does not have a Release file" ⇒ RUN 退出码 100），当时所有门禁全绿、
        # 而照 README 部署的人在第一条 `up` 上就卡死。构建放在 CI 里，这类上游撤源次日就露出来。
        run: docker compose --env-file .env -f deploy/docker-compose.yml build --no-cache postgres
      - name: Prometheus 规则与采集配置校验
        # 挂载必须与 `deploy/docker-compose.yml` 里那两个 :ro 一一对应：`prometheus.yml` 的
        # `rule_files` 写的是容器内路径 `/etc/prometheus/rules/alerts.yml`。
        # 上一版这里把整目录挂到 /cfg 再 check config，promtool 照配置文件里的绝对路径去找，
        # 得到的是 `"/etc/prometheus/rules/alerts.yml" does not point to an existing file`
        # ——校验失败的是这一步的挂载形态，不是配置本身（CI 实测红过一次）。
        run: |
          docker run --rm \
            -v "$PWD/deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/observability/alerts.yml:/etc/prometheus/rules/alerts.yml:ro" \
            --entrypoint /bin/promtool prom/prometheus:v2.55.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/deploy/observability/alerts.yml:/etc/prometheus/rules/alerts.yml:ro" \
            --entrypoint /bin/promtool prom/prometheus:v2.55.0 \
            check rules /etc/prometheus/rules/alerts.yml
      - name: Alertmanager 分发与抑制配置校验
        run: |
          docker run --rm -v "$PWD/deploy:/cfg:ro" --entrypoint /bin/amtool \
            prom/alertmanager:v0.27.0 check-config /cfg/observability/alertmanager.yml

  integration-nats:
    name: 真实 NATS JetStream 总线集成测试
    runs-on: ubuntu-latest
    needs: gate
    defaults:
      run:
        working-directory: backend
    env:
      AEGIS_TEST_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4

      - name: 启动带 JetStream 的 NATS
        # 不用 services: 而是显式 docker run：services 传不进 nats-server 的命令行参数，
        # 而默认启动的 NATS 没有 JetStream——建流会失败（今晚接上真服务器才暴露出来）。
        #
        # 判据换过一次才对流：原写法 `grep '"enabled": ?true'` 盯的是一个**不存在的字段**——
        # nats-server v2.10.29 的 /jsz 顶层没有 `enabled`（本机实测），于是这条 job 从写下那刻
        # 就不可能绿：最近 20 次运行里它成功 0 次、被 skip 17 次（此前一直卡在 gate 后面没人看见）、
        # 真跑 1 次即红。中途想改用的 `/healthz?js-enabled-only` 实测也不是判据（开不开 JS 都回 200）。
        # 真正的信号是反向的：没开 JetStream 时 /jsz 里才会出现 `"disabled"`。
        # 三分支本机各验过一次：有 JS→就绪；无 JS→判未就绪；端口没人听→curl 失败也判未就绪
        # （`|| continue` 是必需的，否则"连不上"会被空响应误判成就绪）。
        run: |
          docker run -d --name aegis-nats \
            -p 127.0.0.1:4222:4222 -p 127.0.0.1:8222:8222 \
            nats:2.10-alpine -js -sd /tmp/js -m 8222
          for _ in $(seq 1 30); do
            body=$(curl -sf "http://127.0.0.1:8222/jsz") || { sleep 1; continue; }
            if printf '%s' "$body" | grep -q '"disabled"'; then
              echo "JetStream 被服务端明确报为 disabled"; sleep 1; continue
            fi
            echo "JetStream 就绪"; exit 0
          done
          echo "NATS JetStream 未就绪" >&2
          docker logs aegis-nats >&2
          exit 1

      - uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true

      - run: uv sync --frozen --extra dev

      - name: NATS 总线往返与持久订阅
        run: uv run pytest -q -m nats tests/integration/test_nats_bus.py

  integration-postgres:
    # 持久层是这平台唯一的事实底座（预警、台账、共享记忆、向量检索都落在这里），
    # 而内存读视图不校验 SQL、不建扩展、也不会暴露 ST_DWithin 的单位问题——
    # 这三个文件此前只在"我本机的临时库"上跑过，CI 全程 skip：绿色门禁从来没测过数据面。
    name: 真实 PostgreSQL + PostGIS + pgvector 集成测试
    runs-on: ubuntu-latest
    needs: gate
    defaults:
      run:
        working-directory: backend
    env:
      # 一次性容器里的口令，随运行作废；不是任何现场凭据。
      AEGIS_TEST_PG_DSN: postgresql://aegis:ci_only_pw@127.0.0.1:5543/aegis
    steps:
      - uses: actions/checkout@v4

      - name: 起一个只属于本次运行的库
        # 复用 deploy/postgres/Dockerfile（postgis + pgvector 同镜像）而不是裸 postgis 官方镜像：
        # 官方镜像没有 pgvector，`001_extensions.sql` 的 CREATE EXTENSION vector 会当场炸。
        # 宿主端口用 5543，避开 runner 上可能已占 5432 的 service；也不用 compose up——
        # 那会带命名卷与 restart policy，这里只需要一个跑完即弃的库进程。
        #
        # 路径必须带 $GITHUB_WORKSPACE：本 job 的 defaults 是 backend（第 246 行），
        # 写相对路径 `deploy/postgres` 会被解析成 `backend/deploy/postgres`，
        # 首跑就是那句 `unable to prepare context: path "deploy/postgres" not found`。
        run: |
          docker build -t aegis-pg-ci "$GITHUB_WORKSPACE/deploy/postgres"
          docker run -d --name aegis-pg-ci \
            -p 127.0.0.1:5543:5432 \
            -e POSTGRES_USER=aegis -e POSTGRES_PASSWORD=ci_only_pw -e POSTGRES_DB=aegis \
            aegis-pg-ci
          for _ in $(seq 1 60); do
            if docker exec aegis-pg-ci pg_isready -U aegis -d aegis >/dev/null 2>&1; then
              echo "库就绪"; exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL 未就绪" >&2
          docker logs aegis-pg-ci >&2
          exit 1

      - uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true

      - run: uv sync --frozen --extra dev --extra postgres

      - name: 落库 / 空间算子 / 向量检索 / 台账直读
        # 这套用例会 `TRUNCATE … RESTART IDENTITY CASCADE`（9 张表）——只在这个跑完即删的容器里发生。
        # 本机绝不允许对着演示库跑这条（会清掉现场数据），本仓的口径是另建专用库。
        run: |
          uv run pytest -q \
            tests/integration/test_persistence_postgres.py \
            tests/integration/test_geo_endpoints_live.py \
            tests/integration/test_accuracy_replay_live.py \
            --junitxml=reports/junit-postgres.xml

      - name: 上传真库计数
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-postgres-report
          path: backend/reports/junit-postgres.xml
          if-no-files-found: error

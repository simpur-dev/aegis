name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 质量门禁（格式 / Lint / 类型 / 测试 / 演练）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true

      - name: 安装依赖
        # 各可选子系统（持久层/分析/检索/边缘/图谱）的离线单测需要真驱动才能跑起来：
        # 只装 dev 会让这些用例静默跳过，绿色 CI 等于什么都没测。
        run: uv sync --extra dev --extra perf --extra postgres --extra analytics --extra retrieval --extra edge --extra graph --extra seekdb

      - name: 格式检查
        run: uv run ruff format --check src tests scripts

      - name: 静态检查
        run: uv run ruff check src tests scripts

      - name: 类型检查
        run: uv run mypy src

      - name: 单元 + 契约门禁 + 端到端
        run: uv run pytest -q --maxfail=1

      - name: 指标实测冒烟（Mock 智能体）
        run: uv run python -m scripts.metrics_report --rounds 6 --agents --out reports/ci-metrics.json

      - name: 上传指标报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-report
          path: backend/reports/ci-metrics.json
          if-no-files-found: ignore

  frontend:
    name: 前端门禁（类型 / 单测 / 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy-artifacts:
    # 部署面的工件此前只有人手工跑过一次：compose 能不能解析、告警规则与分发配置过不过校验。
    # "文件存在"和"链路能起"是两件事——这条 job 把它们钉成构建失败，而不是交付后现场才发现。
    name: 部署面工件校验（compose 解析 / promtool / amtool）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose 三个 profile 必须能解析（凭据取自 .env.example）
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/docker-compose.yml \
            --profile observability --profile app --profile iot config --quiet
      - name: Prometheus 规则与采集配置校验
        run: |
          docker run --rm -v "$PWD/deploy:/cfg:ro" --entrypoint /bin/promtool \
            prom/prometheus:v2.55.0 check rules /cfg/observability/alerts.yml
          docker run --rm -v "$PWD/deploy:/cfg:ro" --entrypoint /bin/promtool \
            prom/prometheus:v2.55.0 check config /cfg/prometheus.yml
      - name: Alertmanager 分发与抑制配置校验
        run: |
          docker run --rm -v "$PWD/deploy:/cfg:ro" --entrypoint /bin/amtool \
            prom/alertmanager:v0.27.0 check-config /cfg/observability/alertmanager.yml

  integration-nats:
    name: 真实 NATS JetStream 总线集成测试
    runs-on: ubuntu-latest
    needs: gate
    defaults:
      run:
        working-directory: backend
    env:
      AEGIS_TEST_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4

      - name: 启动带 JetStream 的 NATS
        # 不用 services: 而是显式 docker run：services 传不进 nats-server 的命令行参数，
        # 而默认启动的 NATS 没有 JetStream——建流会失败（今晚接上真服务器才暴露出来）。
        run: |
          docker run -d --name aegis-nats \
            -p 127.0.0.1:4222:4222 -p 127.0.0.1:8222:8222 \
            nats:2.10-alpine -js -sd /tmp/js -m 8222
          for _ in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8222/jsz" | grep -Eq '"enabled": ?true'; then
              echo "JetStream 就绪"; exit 0
            fi
            sleep 1
          done
          echo "NATS JetStream 未就绪" >&2
          docker logs aegis-nats >&2
          exit 1

      - uses: astral-sh/setup-uv@v4
        with:
          enable-caching: true

      - run: uv sync --extra dev

      - name: NATS 总线往返与持久订阅
        run: uv run pytest -q -m nats tests/integration/test_nats_bus.py

name: aegis

services:
  nats:
    image: nats:2.10-alpine
    container_name: aegis-nats
    command: ["--jetstream", "--store_dir", "/data", "--cluster_name", "aegis"]
    ports:
      - "4222:4222" # 客户端
      - "6222:6222" # 路由
      - "8222:8222" # 监控
    volumes:
      - nats_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    # PostgreSQL 17 + PostGIS + pgvector 同镜像（P0 选型）。DDL 不在这里执行：
    # 唯一事实源是 backend/src/aegis/persistence/sql/*.sql，由平台启动时按序应用并记校验和。
    build:
      context: ./postgres
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 需在 .env 中设置}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: aegis-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD 需在 .env 中设置}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: aegis-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 需在 .env 中设置}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.8
    container_name: aegis-emqx
    environment:
      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:?EMQX_DASHBOARD_PASSWORD 需在 .env 中设置}
    ports:
      - "1883:1883" # MQTT
      - "8083:8083" # MQTT over WS
      - "18083:18083" # Dashboard
    volumes:
      - emqx_data:/data
    restart: unless-stopped
    profiles: ["iot"]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: aegis-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    profiles: ["observability"]

  # 链路追踪取证件：跨度经 OTLP/HTTP 进来，验收时用 /api/traces/<traceID> 原样找回。
  # 镜像按摘要锁定（本机实测：python -> OTLP -> Jaeger -> 查询 API 全链路通了 6 个跨度）。
  jaeger:
    image: jaegertracing/all-in-one@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    container_name: aegis-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # 查询 UI / API
      - "4318:4318" # OTLP/HTTP
    restart: unless-stopped
    profiles: ["observability"]

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: aegis-backend
    env_file:
      - ../.env
    environment:
      AEGIS_BUS_BACKEND: nats
      AEGIS_NATS_URL: nats://nats:4222
      # 三条可选腿必须显式选上：不写就等于在生产里静默跑内存视图/无图谱/无检索，
      # 而 /readyz 依旧是绿的。启用事实一律经 /api/v1/integrations 对外可见。
      AEGIS_STORE_BACKEND: postgres
      AEGIS_PG_DSN: postgresql://aegis:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
      AEGIS_PG_APPLY_MIGRATIONS_ON_START: "true"
      AEGIS_KNOWLEDGE_GRAPHITI_URI: bolt://neo4j:7687
      AEGIS_NEO4J_USER: ${NEO4J_USERNAME:-neo4j}
      AEGIS_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD 需在 .env 中设置}
      AEGIS_RETRIEVAL_ENABLED: "true"
      # 端点走 OTel 官方环境变量。只在 observability profile 关闭时留空即可：
      # 跨度改为只记本地，业务链路不受影响（先起 observability 再起 app 就能拿到全量证据链）。
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_ENDPOINT:-}
      AEGIS_HTTP_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # 检索权重只读挂载（~1.1GB，不烧进镜像）：由仓库根 scripts/fetch_retrieval_models.py 预置
      - ../backend/data/models:/models:ro
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["app"]

volumes:
  nats_data:
  pg_data:
  neo4j_data:
  minio_data:
  redis_data:
  emqx_data:
  prometheus_data:

global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: aegis-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: aegis
  - job_name: nats
    static_configs:
      - targets: ["nats:8222"]
        labels:
          service: aegis-bus

# alerts.yml 的表达式回归用例：用 promtool 的单元测法验证阈值、标签拼写与"健康不误报"。
# 输入序列的 le 标签写法与 MetricsExporter 实发一致（浮点渲染：2000.0 / 1.2e+06 / +Inf）。
#
# 运行：
#   docker run --rm -v "$PWD:/w" -w /w/deploy/observability --entrypoint promtool \
#     prom/prometheus:v2.55.0 test rules alerts-test.yml

rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # 协同成功率 66.7%（ok 2/min、timeout 1/min）→ 必须触发
  - interval: 1m
    input_series:
      - series: 'aegis_collab_txn_total{outcome="ok"}'
        values: '0+2x30'
      - series: 'aegis_collab_txn_total{outcome="timeout"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AegisCollabSuccessRateBelowTarget
        exp_alerts:
          - exp_labels:
              severity: critical
              team: aegis-platform
              indicator: 协同事务成功率
              target: ">=90%"
            exp_annotations:
              summary: 多智能体协同联动成功率低于 90%
              description: >-
                近 5 分钟协同事务成功率 66.67%，低于考核线 90%。 按 outcome 拆分定位：timeout 涨→智能体侧超期（deadline_ms）， no_agent 涨→能力注册中心无可用智能体，error 涨→智能体返回 E_* 回执。 取证：/api/v1/collaboration 事务明细 + Jaeger 按 aegis.trace_id 检索。

  # 全部事务成功 → 不得误报（分母为 0 或成功率高都不应触发）
  - interval: 1m
    input_series:
      - series: 'aegis_collab_txn_total{outcome="ok"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AegisCollabSuccessRateBelowTarget
        exp_alerts: []

  # 空闲（完全无事务）→ 不得误报，这正是改用计数器比值而非 Gauge 的原因
  - interval: 1m
    input_series:
      - series: 'aegis_collab_txn_total{outcome="ok"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AegisCollabSuccessRateBelowTarget
        exp_alerts: []

  # 状态同步 P95 落在 2000~5000ms 桶间（插值≈4550ms）→ 超过 3s 触发
  - interval: 1m
    input_series:
      - series: 'aegis_latency_ms_bucket{metric="sync_agent_to_gateway_ms",le="1000.0"}'
        values: '0+1x30'
      - series: 'aegis_latency_ms_bucket{metric="sync_agent_to_gateway_ms",le="2000.0"}'
        values: '0+2x30'
      - series: 'aegis_latency_ms_bucket{metric="sync_agent_to_gateway_ms",le="5000.0"}'
        values: '0+3x30'
      - series: 'aegis_latency_ms_bucket{metric="sync_agent_to_gateway_ms",le="+Inf"}'
        values: '0+3x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AegisStateSyncLatencyOverBudget
        exp_alerts:
          - exp_labels:
              severity: critical
              team: aegis-platform
              indicator: 状态同步时延
              target: "<=3s"
            exp_annotations:
              summary: 共享数据同步时延 P95 超过 3 秒
              description: "近 5 分钟 sync_agent_to_gateway_ms 的 P95 为 4550 ms，超过 3000ms 考核线。 先看 aegis_gateway_events_total{kind=\"inbound\"} 是否堆积（JetStream 背压）， 再看 aegis_agents_online 是否掉线；Jaeger 里按 workflow_schedule_ms 的上游跨度核对时钟偏移。"

  # 调度时延全部落在 1000ms 内 → 不得超过 2s 阈值
  - interval: 1m
    input_series:
      - series: 'aegis_latency_ms_bucket{metric="workflow_schedule_ms",le="1000.0"}'
        values: '0+5x30'
      - series: 'aegis_latency_ms_bucket{metric="workflow_schedule_ms",le="+Inf"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AegisWorkflowScheduleOverBudget
        exp_alerts: []

  # 触达时延越过最高有限桶（1.2e+06 = 20min）→ 只能用桶差值表达，必须触发
  - interval: 1m
    input_series:
      - series: 'aegis_latency_ms_bucket{metric="warning_reach_ms",le="1.2e+06"}'
        values: '0+5x30'
      - series: 'aegis_latency_ms_bucket{metric="warning_reach_ms",le="+Inf"}'
        values: '0+6x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AegisTargetedReachOverBudget
        exp_alerts:
          - exp_labels:
              severity: critical
              team: aegis-platform
              indicator: 预警靶向触达
              target: "<=20min"
            exp_annotations:
              summary: 出现超过 20 分钟才触达的预警
              description: "近 5 分钟有 0.0167 条/秒的 warning_reach_ms 样本越过 1200000ms 考核线。 逐通道排查 delivery 回执：短信/北斗通道拥塞时 DeliveryDispatcher 的重试会把触达时间推后， 必要时提高优先级抢占或切换广播通道。"

  # 逐条违约计数（需先 register_sla_budgets）→ 按 metric 维度触发
  - interval: 1m
    input_series:
      - series: 'aegis_sla_breaches_total{metric="workflow_reschedule_ms"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AegisSlaBreachObserved
        exp_alerts:
          - exp_labels:
              metric: workflow_reschedule_ms
              severity: warning
              team: aegis-platform
              indicator: 考核指标逐条违约
            exp_annotations:
              summary: 考核指标 workflow_reschedule_ms 近 10 分钟出现越限样本
              description: >-
                workflow_reschedule_ms 累计违约 10 次（阈值取自 aegis_sla_threshold_seconds）。 P95 尚未告警说明劣化是间歇性的，先在 Jaeger 按 aegis.sla.breach=true 过滤跨度取证实例。

  # 跨度导出失败 → 取证完整性告警，业务侧告警不受影响
  - interval: 1m
    input_series:
      - series: aegis_telemetry_dropped_spans_total
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AegisTelemetryEvidenceDropped
        exp_alerts:
          - exp_labels:
              severity: warning
              team: aegis-platform
              indicator: 链路取证完整性
            exp_annotations:
              summary: OTLP 跨度导出失败，SLA 取证链出现缺口
              description: "近 10 分钟丢弃 10 条跨度（业务链路不受影响，遥测已按设计降级）。 检查 otlp 端点可达性与 BatchSpanProcessor 队列（4096 条 / 2s 批量 / 5s 超时）； 弱网演练期间可接受，正式验收量测窗口必须先消除该告警。"

  # 数据接入 P95 在 300 秒以内（全部样本落在 250 秒桶内）→ 不超过 5min，不得误报
  - interval: 1m
    input_series:
      - series: 'aegis_latency_ms_bucket{metric="ingest_end_to_end_seconds",le="250.0"}'
        values: '0+10x30'
      - series: 'aegis_latency_ms_bucket{metric="ingest_end_to_end_seconds",le="+Inf"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: AegisDataIngestLatencyOverBudget
        exp_alerts: []

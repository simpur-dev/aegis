[project]
name = "aegis-backend"
version = "0.1.0"
description = "AEGIS 山地灾害多智能体协同调控平台 — 后端（平台侧）/ Adaptive Emergency Geo-hazard Intelligence System"
requires-python = ">=3.11"
authors = [{ name = "AEGIS Project Team" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "nats-py>=2.8",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "prometheus-client>=0.20",
    "orjson>=3.10",
    "openai>=1.50",
    # 可观测性是平台的考核面（SLA 证据链需可被第三方引用），不是可插拔装饰：
    # 缺席时 aegis.observability 会退化成空操作，因此必须在基础依赖里声明，
    # 让任何一次干净安装都真的带上 OTLP 导出能力。
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
perf = ["uvloop>=0.21; sys_platform != 'win32'", "locust>=2.30"]
postgres = ["asyncpg>=0.30", "pgvector>=0.5"]
analytics = ["clickhouse-connect>=1.9", "duckdb>=1.5"]
edge = ["eclipse-zenoh>=1.10"]
retrieval = ["onnxruntime>=1.30", "tokenizers>=0.21", "numpy>=1.26"]
iot = ["aiomqtt>=2.2"]
graph = ["neo4j>=5.26", "graphiti-core>=0.30"]
objectstore = ["minio>=7.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "hypothesis>=6.168",
    "schemathesis>=4.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "contract: 契约一致性测试（Agent 接入规范门禁）",
    "e2e: 端到端链路测试（含时延量测）",
    "nats: 需要真实 NATS JetStream 服务的集成测试",
    "slow: 耗时较长的测试",
]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# 本项目文档与注释以简体中文为主：中文全角标点不应被视为歧义字符（RUF001/002/003）
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
# 按 3.12 语法解析：clickhouse-connect 的传递依赖 numpy 的 .pyi 使用了 `type X = ...`（3.12+ 语法），
# 以 3.11 口径会在解析第三方存根时就报语法错、连带阻断对自有代码的检查。
# 运行时的 3.11 下限仍由 requires-python 与 ruff 的 target-version=py311 守住，两者分工不同。
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
